name: Check links

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in the course
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude linkedin.com
            README.md lessons/**/*.md data/lessons.json
          fail: false
      - name: Open an issue when links break
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found in the weekly check
          content-filepath: ./lychee/out.md
          labels: broken-link
